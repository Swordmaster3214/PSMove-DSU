name: Build and Release

on:
  # "published" fires for a release published directly and for a draft that is
  # published later; "created" doesn't fire for drafts at all.
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: macos-15-intel   # x86_64 (macos-13 runners have been retired)
          - os: macos-latest     # arm64
          - os: windows-latest

    defaults:
      run:
        shell: bash   # Git Bash on Windows, so the shared CI script runs everywhere

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history and tags, so the GUI's version label reads e.g. v3.0.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # PSMoveAPI, Dear ImGui and GLFW are downloaded and compiled statically into
      # the executable by CMake itself (see CMakeLists.txt), so no install step is
      # needed for them. Linux only needs the system dev headers below
      # (xvfb + Mesa are for the GUI check).

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libbluetooth-dev libdbus-1-dev libudev-dev pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri

      - name: Configure with CMake (Windows)
        if: runner.os == 'Windows'
        run: cmake -S . -B build

      - name: Configure with CMake (Linux/macOS)
        if: runner.os != 'Windows'
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      # The same checks as the test builds (.github/scripts/ci_binary.sh), so a
      # release can't publish a binary that fails them.
      - name: Locate executable
        id: artifact
        run: |
          EXE=$(.github/scripts/ci_binary.sh locate)
          NAME=$(basename "$EXE")
          echo "path=$EXE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          cp "$EXE" "artifacts/$NAME"

      - name: Inspect binary
        run: .github/scripts/ci_binary.sh inspect "${{ steps.artifact.outputs.path }}"

      - name: Smoke test (server + DSU protocol)
        timeout-minutes: 3
        run: .github/scripts/ci_binary.sh smoke "${{ steps.artifact.outputs.path }}"

      - name: GUI check (Linux, virtual X server)
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: .github/scripts/ci_binary.sh gui "${{ steps.artifact.outputs.path }}"

      - name: Upload to release (on release event)
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/${{ steps.artifact.outputs.name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Get latest release (on workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        id: latest_release
        shell: bash
        run: |
          # Try to get the latest release
          if LATEST_RELEASE=$(gh api repos/${{ github.repository }}/releases/latest --jq '.tag_name' 2>/dev/null); then
            echo "Found latest release: $LATEST_RELEASE"
            echo "tag_name=$LATEST_RELEASE" >> $GITHUB_OUTPUT
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "No releases found - will create a new one"
            echo "exists=false" >> $GITHUB_OUTPUT
            echo "tag_name=v1.0.0" >> $GITHUB_OUTPUT
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create release if none exists (on workflow_dispatch)
        if: github.event_name == 'workflow_dispatch' && steps.latest_release.outputs.exists == 'false'
        shell: bash
        run: |
          gh release create ${{ steps.latest_release.outputs.tag_name }} \
            --title "Release ${{ steps.latest_release.outputs.tag_name }}" \
            --notes "Automated release created by workflow dispatch" \
            --repo ${{ github.repository }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload to release (on workflow_dispatch)
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          gh release upload ${{ steps.latest_release.outputs.tag_name }} \
            "artifacts/${{ steps.artifact.outputs.name }}" \
            --repo ${{ github.repository }} \
            --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
