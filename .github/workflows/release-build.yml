name: Build and Release

on:
  # Pushing a v* tag builds every platform and attaches the binaries to a DRAFT
  # release. Review the draft, then publish it by hand.
  push:
    tags: ['v*']
  # Re-run for an existing tag (e.g. after fixing the workflow).
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build and attach to a draft release (e.g. v3.1.0)'
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: macos-15-intel   # x86_64 (macos-13 runners have been retired)
          - os: macos-latest     # arm64
          - os: windows-latest
          - os: ubuntu-22.04-arm # arm64
          - os: windows-11-arm   # arm64

    defaults:
      run:
        shell: bash   # Git Bash on Windows, so the shared CI script runs everywhere

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0  # full history and tags, so the GUI's version label reads e.g. v3.0.0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # PSMoveAPI, Dear ImGui and GLFW are downloaded and compiled statically into
      # the executable by CMake itself (see CMakeLists.txt), so no install step is
      # needed for them. Linux only needs the system dev headers below
      # (xvfb + Mesa are for the GUI check).

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libbluetooth-dev libdbus-1-dev libudev-dev pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri

      - name: Configure with CMake
        run: cmake --preset release

      - name: Build
        run: cmake --build build --config Release --parallel

      # The same checks as the test builds (.github/scripts/ci_binary.sh), so a
      # release can't publish a binary that fails them.
      - name: Locate executable
        id: artifact
        run: |
          EXE=$(.github/scripts/ci_binary.sh locate)
          NAME=$(basename "$EXE")
          echo "path=$EXE" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          mkdir -p artifacts
          cp "$EXE" "artifacts/$NAME"

      - name: Inspect binary
        run: .github/scripts/ci_binary.sh inspect "${{ steps.artifact.outputs.path }}"

      - name: Smoke test (server + DSU protocol)
        timeout-minutes: 3
        run: .github/scripts/ci_binary.sh smoke "${{ steps.artifact.outputs.path }}"

      - name: GUI check (Linux, virtual X server)
        if: runner.os == 'Linux'
        timeout-minutes: 2
        run: .github/scripts/ci_binary.sh gui "${{ steps.artifact.outputs.path }}"

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: bin-${{ matrix.os }}
          path: artifacts/${{ steps.artifact.outputs.name }}
          if-no-files-found: error

  # One job creates the release, so the parallel builds can't race to create
  # several drafts for the same tag.
  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: bin-*
          merge-multiple: true
          path: artifacts

      - name: List binaries
        run: ls -l artifacts

      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          draft: true
          files: artifacts/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
