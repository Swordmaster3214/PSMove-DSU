name: macOS Test Build

# Builds Intel (x86_64) and Apple Silicon (arm64) binaries for testing a branch.
#
# Runs on every push to a branch other than main (GitHub only offers the "Run
# workflow" button for workflows that already exist on main), or by hand from
# the Actions tab. Binaries are attached to the run as artifacts.
# The checks live in .github/scripts/ci_binary.sh and are shared by all builds.

on:
  push:
    branches-ignore: [main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel   # Intel runner
            arch: x86_64
          - os: macos-latest     # Apple Silicon runner
            arch: arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # PSMoveAPI, Dear ImGui and GLFW are downloaded and built statically by CMake.
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j "$(sysctl -n hw.ncpu)"

      - name: Locate executable
        id: exe
        run: |
          EXE=$(.github/scripts/ci_binary.sh locate)
          echo "path=$EXE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$EXE")" >> "$GITHUB_OUTPUT"

      - name: Inspect binary
        run: .github/scripts/ci_binary.sh inspect "${{ steps.exe.outputs.path }}"

      - name: Package
        run: |
          mkdir -p dist
          cp "${{ steps.exe.outputs.path }}" dist/
          cat > dist/README-macOS.txt <<'EOF'
          PSMove-DSU test build for macOS (${{ matrix.arch }}), commit ${{ github.sha }}

          This build is not signed or notarized. After extracting:

            xattr -d com.apple.quarantine ./${{ steps.exe.outputs.name }}
            ./${{ steps.exe.outputs.name }}

          (Or right-click the file in Finder > Open, and confirm.)
          Add --headless to run without the GUI, --help for all options.
          EOF
          # tar keeps the executable bit, which artifact zips would drop
          tar -czf "${{ steps.exe.outputs.name }}.tar.gz" -C dist .

      # Uploaded before the smoke test so a test failure still leaves a binary to try.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.exe.outputs.name }}
          path: ${{ steps.exe.outputs.name }}.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Smoke test (server + DSU protocol)
        timeout-minutes: 3
        run: .github/scripts/ci_binary.sh smoke "${{ steps.exe.outputs.path }}"
