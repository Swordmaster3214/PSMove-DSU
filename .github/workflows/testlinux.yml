name: Linux Test Build

# Builds a Linux x64 binary for testing a branch.
#
# Runs on every push to a branch other than main (GitHub only offers the "Run
# workflow" button for workflows that already exist on main), or by hand from
# the Actions tab. The binary is attached to the run as an artifact.
# The checks live in .github/scripts/ci_binary.sh and are shared by all builds.

on:
  push:
    branches-ignore: [main]
    paths-ignore: ['**.md', 'LICENSE']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    name: Linux x64
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # PSMoveAPI, Dear ImGui and GLFW are downloaded and built statically by
      # CMake; only system headers are needed. xvfb + Mesa are for the GUI check.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbluetooth-dev libdbus-1-dev libudev-dev pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release -j "$(nproc)"

      - name: Locate executable
        id: exe
        run: |
          EXE=$(.github/scripts/ci_binary.sh locate)
          echo "path=$EXE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$EXE")" >> "$GITHUB_OUTPUT"

      - name: Inspect binary
        run: .github/scripts/ci_binary.sh inspect "${{ steps.exe.outputs.path }}"

      - name: Package
        run: |
          GLIBC=$(objdump -T "${{ steps.exe.outputs.path }}" | grep -o 'GLIBC_[0-9.]*' | sort -u -V | tail -n 1)
          mkdir -p dist
          cp "${{ steps.exe.outputs.path }}" dist/
          cat > dist/README-Linux.txt <<EOF
          PSMove-DSU test build for Linux x64, commit ${{ github.sha }}

          Needs glibc ${GLIBC#GLIBC_} or newer, plus libbluetooth, libdbus-1 and libudev
          (installed on most desktop distributions). The GUI uses X11 or Wayland; without
          a display the program runs headless automatically.

            ./${{ steps.exe.outputs.name }}

          Add --headless to run without the GUI, --help for all options.
          EOF
          # tar keeps the executable bit, which artifact zips would drop
          tar -czf "${{ steps.exe.outputs.name }}.tar.gz" -C dist .

      # Uploaded before the tests so a test failure still leaves a binary to try.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.exe.outputs.name }}
          path: ${{ steps.exe.outputs.name }}.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Smoke test (server + DSU protocol)
        timeout-minutes: 3
        run: .github/scripts/ci_binary.sh smoke "${{ steps.exe.outputs.path }}"

      - name: GUI check (virtual X server)
        timeout-minutes: 2
        run: .github/scripts/ci_binary.sh gui "${{ steps.exe.outputs.path }}"
