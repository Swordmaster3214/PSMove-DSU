name: Linux Test Build

# Builds Linux x64 and arm64 binaries for testing a branch. Only "Linux x64"
# is a required check; arm64 is informational.
#
# Runs on every push to main, on pull requests into main (open a draft pull
# request to get test binaries for a branch), and by hand from the Actions tab
# for any branch.
# The binary is attached to the run as an artifact.
# The checks live in .github/scripts/ci_binary.sh and are shared by all builds.

on:
  # Pull requests into main must pass this check before they can be merged
  # (required in the repository's ruleset). No paths-ignore: a skipped required
  # check never reports, which would block docs-only pull requests.
  pull_request:
    branches: [main]
  # Commits pushed straight to main. Limited to main so a pull request's
  # commits aren't built twice (once for the push, once for the pull request).
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-linux:
    # The job name must stay "Linux x64" for the required check in the ruleset.
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: ubuntu-latest
          - arch: arm64
            os: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # PSMoveAPI, Dear ImGui and GLFW are downloaded and built statically by
      # CMake; only system headers are needed. xvfb + Mesa are for the GUI check.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libbluetooth-dev libdbus-1-dev libudev-dev pkg-config \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev \
            xvfb libgl1 libglx-mesa0 libgl1-mesa-dri

      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build build --config Release -j "$(nproc)"

      - name: Locate executable
        id: exe
        run: |
          EXE=$(.github/scripts/ci_binary.sh locate)
          echo "path=$EXE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$EXE")" >> "$GITHUB_OUTPUT"

      - name: Inspect binary
        run: .github/scripts/ci_binary.sh inspect "${{ steps.exe.outputs.path }}"

      - name: Package
        run: |
          GLIBC=$(objdump -T "${{ steps.exe.outputs.path }}" | grep -o 'GLIBC_[0-9.]*' | sort -u -V | tail -n 1)
          mkdir -p dist
          cp "${{ steps.exe.outputs.path }}" dist/
          cat > dist/README-Linux.txt <<EOF
          PSMove-DSU test build for Linux ${{ matrix.arch }}, commit ${{ github.sha }}

          Needs glibc ${GLIBC#GLIBC_} or newer, plus libbluetooth, libdbus-1 and libudev
          (installed on most desktop distributions). The GUI uses X11 or Wayland; without
          a display the program runs headless automatically.

            ./${{ steps.exe.outputs.name }}

          Add --headless to run without the GUI, --help for all options.
          EOF
          # tar keeps the executable bit, which artifact zips would drop
          tar -czf "${{ steps.exe.outputs.name }}.tar.gz" -C dist .

      # Uploaded before the tests so a test failure still leaves a binary to try.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.exe.outputs.name }}
          path: ${{ steps.exe.outputs.name }}.tar.gz
          retention-days: 30
          if-no-files-found: error

      - name: Smoke test (server + DSU protocol)
        timeout-minutes: 3
        run: .github/scripts/ci_binary.sh smoke "${{ steps.exe.outputs.path }}"

      - name: GUI check (virtual X server)
        timeout-minutes: 2
        run: .github/scripts/ci_binary.sh gui "${{ steps.exe.outputs.path }}"

  # Runs the built server against a real Dolphin Emulator (two simulated
  # controllers mapped to Wii Remotes 1 and 2) and fails if Dolphin's DSU
  # subscriptions are missing or time out. Informational: not a required
  # check, so a Dolphin packaging hiccup can't block a merge.
  dolphin-check:
    name: Dolphin check
    needs: build-linux
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download the x64 build
        uses: actions/download-artifact@v4
        with:
          name: dsu_server_psmove_linux_x64
          path: dl

      - name: Unpack
        run: |
          mkdir -p bin
          tar -xzf dl/*.tar.gz -C bin
          ls -l bin

      # xvfb gives Dolphin a display. libbluetooth/libdbus/libudev are runtime
      # dependencies of the server binary itself.
      - name: Install Dolphin and a virtual display
        run: |
          sudo apt-get update
          sudo apt-get install -y dolphin-emu xvfb libgl1 libglx-mesa0 libgl1-mesa-dri \
            libbluetooth3 libdbus-1-3 libudev1
          which dolphin-emu

      - name: Server + Dolphin
        run: |
          # Without a working D-Bus session, Dolphin's Qt UI blocks forever in
          # a D-Bus call, so turn D-Bus off. Software GL avoids needing a GPU.
          export DBUS_SESSION_BUS_ADDRESS=disabled:
          export LIBGL_ALWAYS_SOFTWARE=1
          export QT_LOGGING_RULES="qt.core.qobject.connect=false"
          xvfb-run -a python3 test/run_dolphin_check.py \
            bin/dsu_server_psmove_linux_x64 "$(which dolphin-emu)" --seconds 120
