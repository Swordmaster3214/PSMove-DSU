name: Windows Test Build

# Builds a Windows x64 binary for testing a branch.
#
# Runs on pull requests into main (open a draft pull request to get test
# binaries for a branch), or by hand from the Actions tab for any branch.
# The binary is attached to the run as an artifact.
# The checks live in .github/scripts/ci_binary.sh and are shared by all builds.

on:
  # Pull requests into main must pass this check before they can be merged
  # (required in the repository's ruleset). No paths-ignore: a skipped required
  # check never reports, which would block docs-only pull requests. There's no
  # push trigger, so a pull request's commits aren't built twice.
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # Git Bash, so the shared CI script runs the same as elsewhere

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # PSMoveAPI, Dear ImGui and GLFW are downloaded and built statically by CMake.
      - name: Configure
        run: cmake -S . -B build

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Locate executable
        id: exe
        run: |
          EXE=$(.github/scripts/ci_binary.sh locate)
          echo "path=$EXE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$EXE")" >> "$GITHUB_OUTPUT"

      - name: Inspect binary
        run: .github/scripts/ci_binary.sh inspect "${{ steps.exe.outputs.path }}"

      - name: Package
        run: |
          mkdir -p dist
          cp "${{ steps.exe.outputs.path }}" dist/
          cat > dist/README-Windows.txt <<'EOF'
          PSMove-DSU test build for Windows x64, commit ${{ github.sha }}

          This build is not signed. If SmartScreen warns about it, click
          "More info" and then "Run anyway".

          Add --headless to run without the GUI, --help for all options.
          EOF

      # Uploaded before the smoke test so a test failure still leaves a binary to try.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.exe.outputs.name }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Smoke test (server + DSU protocol)
        timeout-minutes: 3
        run: .github/scripts/ci_binary.sh smoke "${{ steps.exe.outputs.path }}"
