name: Windows Test Build

# Builds Windows x64 and arm64 binaries for testing a branch. Only "Windows x64"
# is a required check; arm64 is informational.
#
# Runs on every push to main, on pull requests into main (open a draft pull
# request to get test binaries for a branch), and by hand from the Actions tab
# for any branch.
# The binary is attached to the run as an artifact.
# The checks live in .github/scripts/ci_binary.sh and are shared by all builds.

on:
  # Pull requests into main must pass this check before they can be merged
  # (required in the repository's ruleset). No paths-ignore: a skipped required
  # check never reports, which would block docs-only pull requests.
  pull_request:
    branches: [main]
  # Commits pushed straight to main. Limited to main so a pull request's
  # commits aren't built twice (once for the push, once for the pull request).
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-test-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash   # Git Bash, so the shared CI script runs the same as elsewhere

jobs:
  build-windows:
    # The job name must stay "Windows x64" for the required check in the ruleset.
    name: Windows ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            os: windows-latest
          - arch: arm64
            os: windows-11-arm

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # PSMoveAPI, Dear ImGui and GLFW are downloaded and built statically by CMake.
      - name: Configure
        run: cmake --preset release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Locate executable
        id: exe
        run: |
          EXE=$(.github/scripts/ci_binary.sh locate)
          echo "path=$EXE" >> "$GITHUB_OUTPUT"
          echo "name=$(basename "$EXE")" >> "$GITHUB_OUTPUT"

      - name: Inspect binary
        run: .github/scripts/ci_binary.sh inspect "${{ steps.exe.outputs.path }}"

      - name: Package
        run: |
          mkdir -p dist
          cp "${{ steps.exe.outputs.path }}" dist/
          cat > dist/README-Windows.txt <<'EOF'
          PSMove-DSU test build for Windows ${{ matrix.arch }}, commit ${{ github.sha }}

          This build is not signed. If SmartScreen warns about it, click
          "More info" and then "Run anyway".

          Add --headless to run without the GUI, --help for all options.
          EOF

      # Uploaded before the smoke test so a test failure still leaves a binary to try.
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.exe.outputs.name }}
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Smoke test (server + DSU protocol)
        timeout-minutes: 3
        run: .github/scripts/ci_binary.sh smoke "${{ steps.exe.outputs.path }}"

  # Runs the built server against a real Dolphin Emulator (two simulated
  # controllers mapped to Wii Remotes 1 and 2) and fails if Dolphin's DSU
  # subscriptions are missing or time out. Informational: not a required check.
  dolphin-check:
    name: Dolphin check
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Download the x64 build
        uses: actions/download-artifact@v4
        with:
          name: dsu_server_psmove_win64.exe
          path: bin

      # Pinned to a stable release so the check doesn't change under us.
      - name: Download Dolphin
        env:
          DOLPHIN_VERSION: '2609'
          DOLPHIN_SHA256: '1aa25785b7d4cb76259754c5fbcdd8856857b8e7bb4e523c57a8ac56665fba75'
        run: |
          curl -fsSL -o dolphin.7z "https://dl.dolphin-emu.org/releases/${DOLPHIN_VERSION}/dolphin-${DOLPHIN_VERSION}-x64.7z"
          echo "${DOLPHIN_SHA256}  dolphin.7z" | sha256sum -c -
          7z x -y dolphin.7z -odolphin > /dev/null
          ls dolphin/Dolphin-x64/Dolphin.exe

      - name: Server + Dolphin
        run: |
          python test/run_dolphin_check.py \
            bin/dsu_server_psmove_win64.exe dolphin/Dolphin-x64/Dolphin.exe --seconds 120
